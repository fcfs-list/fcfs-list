version: '3.8'

services:

  backend:
    build: ./project
    command:  bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; alembic upgrade head; uvicorn app.main:app --host 0.0.0.0'
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://kashikally:kashikally@db:5432/kashikally
    volumes:
      - ./project:/usr/src/app
    depends_on:
      - db

  db:
    image: postgres:13.4
    expose:
      - 5432
    environment:
      - POSTGRES_USER=kashikally
      - POSTGRES_PASSWORD=kashikally
      - POSTGRES_DB=kashikally
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: